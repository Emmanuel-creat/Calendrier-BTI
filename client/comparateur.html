<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c9c9c9" />
  <title>Comparateur · Planning M2 BTI</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/comparateur.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=6" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/icon-64.png?v=6" />
  <link rel="icon" type="image/png" sizes="128x128" href="/assets/icon-128.png?v=6" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png?v=6" />
  <link rel="apple-touch-icon" href="/assets/icon-180.png?v=6" />
</head>
<body>
  <div class="ambient"></div>

  <div class="app-shell">
    <aside class="sidebar glass">
      <header class="sidebar-header">
        <div class="mac-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </header>

      <div class="user-card">
        <div class="user-avatar"><img src="/assets/icon-128.png?v=6" alt="" /></div>
        <div class="user-meta">
          <span class="user-name">Comparateur</span>
          <span class="user-mail">Excel ↔ ADE</span>
        </div>
      </div>

      <div class="nav-group">
        <p class="nav-title">Sources</p>
        <div class="cmp-source">
          <span class="cmp-source-label">Excel</span>
          <span class="cmp-source-val" id="src-excel">—</span>
        </div>
        <div class="cmp-source">
          <span class="cmp-source-label">ADE (sync)</span>
          <span class="cmp-source-val" id="src-ade">—</span>
        </div>
      </div>

      <div class="nav-group">
        <p class="nav-title">Comparer sur</p>
        <div class="cmp-fields" id="cmp-fields">
          <label class="cmp-field">
            <input type="checkbox" data-field="horaires" checked />
            <span>Horaires</span>
          </label>
          <label class="cmp-field">
            <input type="checkbox" data-field="matieres" checked />
            <span>Matières</span>
          </label>
          <label class="cmp-field">
            <input type="checkbox" data-field="prof" checked />
            <span>Prof</span>
          </label>
          <label class="cmp-field">
            <input type="checkbox" data-field="salles" checked />
            <span>Salles</span>
          </label>
        </div>
      </div>

      <div class="nav-group">
        <button type="button" class="btn-compare" id="btn-compare">Comparer maintenant</button>
        <button type="button" class="btn-refresh" id="btn-refresh" title="Retélécharge l'Excel AMU box et le flux ADE">↻ Rafraîchir données</button>
      </div>

      <div class="nav-group">
        <p class="nav-title">Légende</p>
        <ul class="legend">
          <li><span class="dot d-diff"></span>Différence détectée</li>
          <li><span class="dot d-fss"></span>Salle FSS (précisée par ADE)</li>
          <li><span class="dot d-ok"></span>Concordant</li>
        </ul>
      </div>

      <div class="nav-group">
        <a class="cmp-link" href="/">← Retour au planning</a>
      </div>
    </aside>

    <main class="main glass">
      <header class="topbar">
        <div class="topbar-title">
          <p class="eyebrow">Comparateur</p>
          <h1>ADE ↔ Excel</h1>
        </div>
        <div class="topbar-stats">
          <div class="stat">
            <span class="stat-label">Jours avec différence</span>
            <div class="stat-row">
              <span class="stat-value" id="stat-diff">—</span>
              <span class="stat-delta" id="stat-total"></span>
            </div>
          </div>
        </div>
      </header>

      <section class="cmp-grid-wrap">
        <div id="cmp-grid" class="cmp-grid"></div>
        <div class="empty-state" id="cmp-empty" hidden>
          <p>Clique sur « Comparer maintenant » pour lancer l'analyse.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Modale détail d'une journée -->
  <div id="cmp-modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel glass modal-panel-wide" role="dialog" aria-labelledby="cmp-modal-title">
      <button class="modal-close" type="button" data-modal-close aria-label="Fermer">×</button>
      <h2 id="cmp-modal-title">Détail du jour</h2>
      <div class="cmp-day-grid" id="cmp-day-grid"></div>
    </div>
  </div>

  <script type="module" src="/js/comparateur.js"></script>
</body>
</html>
