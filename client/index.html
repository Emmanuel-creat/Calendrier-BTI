<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2eb" />
  <title>Planning M2 BTI</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E📅%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Planning<br /><span class="brand-accent">M2 BTI</span></h1>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" id="today-btn">
          <span class="nav-ico">◐</span>
          <span>Aujourd’hui</span>
        </button>

        <div class="nav-block">
          <label class="nav-label">Profil</label>
          <div class="nav-select">
            <select id="profile-select" aria-label="Profil"></select>
          </div>
        </div>

        <div class="nav-block">
          <label class="nav-label">Semaine</label>
          <div class="week-nav">
            <button type="button" class="btn-icon" id="prev-week" aria-label="Semaine précédente">‹</button>
            <input type="week" id="week-input" aria-label="Choisir une semaine" />
            <button type="button" class="btn-icon" id="next-week" aria-label="Semaine suivante">›</button>
          </div>
        </div>

        <div class="nav-block">
          <label class="nav-label">Légende</label>
          <ul class="legend">
            <li><span class="legend-chip c-rose"></span> BTI (tous)</li>
            <li><span class="legend-chip c-jaune"></span> Cours communs</li>
            <li><span class="legend-chip c-bleu"></span> PolyTech + BTI</li>
            <li><span class="legend-chip c-orange"></span> ECM + BTI</li>
            <li><span class="legend-chip c-vert"></span> Événement</li>
          </ul>
        </div>
      </nav>

      <div class="sidebar-promo">
        <div class="promo-illu">
          <svg viewBox="0 0 100 60" aria-hidden="true">
            <path d="M0 55 L18 32 L36 42 L54 20 L72 28 L90 8 L100 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
            <path d="M85 15 L92 8 L98 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
        </div>
        <h3>Planning à jour</h3>
        <p id="promo-meta">Source Excel · toujours synchronisée</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <p class="eyebrow" id="topbar-eyebrow">Semaine en cours</p>
          <h2 id="topbar-heading">Aujourd’hui</h2>
        </div>
        <div class="topbar-right">
          <div class="pill-row">
            <div class="pill pill-now" id="pill-now" hidden></div>
            <div class="pill pill-next" id="pill-next" hidden></div>
          </div>
        </div>
      </header>

      <section class="calendar-card">
        <div id="calendar-wrap">
          <div id="calendar" class="calendar" role="grid" aria-label="Emploi du temps hebdomadaire"></div>
          <div class="empty-state" id="empty-state" hidden>
            <p>Aucun cours cette semaine.</p>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        <span id="meta-info"></span>
      </footer>
    </main>
  </div>

  <div id="course-modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel" role="dialog" aria-labelledby="course-modal-title">
      <button class="modal-close" type="button" data-modal-close aria-label="Fermer">×</button>
      <div id="course-modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
