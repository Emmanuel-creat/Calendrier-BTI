<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c9c9c9" />
  <title>Planning M2 BTI</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E📅%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="ambient"></div>

  <div class="app-shell">
    <!-- Rail vertical sombre -->
    <nav class="rail" aria-label="Navigation principale">
      <div class="rail-brand" title="Planning">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/></svg>
      </div>
      <div class="rail-group">
        <button type="button" class="rail-btn active" data-view="home" aria-label="Semaine">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2V11z"/></svg>
        </button>
        <button type="button" class="rail-btn" aria-label="Ajourd’hui" id="rail-today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button type="button" class="rail-btn" aria-label="Prochains cours">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 15.4 6.8 18.1l1-5.8L3.5 8.2l5.9-.9L12 2z"/></svg>
        </button>
        <button type="button" class="rail-btn" aria-label="Profils">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12h7"/></svg>
        </button>
        <button type="button" class="rail-btn" aria-label="Salles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        </button>
        <button type="button" class="rail-btn" aria-label="Vues">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
      <button type="button" class="rail-btn rail-btn-settings" aria-label="Paramètres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>

    <!-- Sidebar glass -->
    <aside class="sidebar glass">
      <header class="sidebar-header">
        <div class="mac-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </header>

      <div class="user-card">
        <div class="user-avatar">📅</div>
        <div class="user-meta">
          <span class="user-name">Planning M2 BTI <span class="chev">›</span></span>
          <span class="user-mail">source : planning.xlsx</span>
        </div>
      </div>

      <div class="nav-group">
        <p class="nav-title">Navigation</p>
        <button type="button" class="nav-row selected" id="today-btn">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v4M16 3v4M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></span>
          <span class="lbl">Aujourd’hui</span>
          <span class="badge" id="today-count">0</span>
        </button>
        <button type="button" class="nav-row" id="btn-week-select">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg></span>
          <span class="lbl">Semaine</span>
          <span class="chev">›</span>
        </button>
        <button type="button" class="nav-row" id="btn-goto-current">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg></span>
          <span class="lbl">Semaine en cours</span>
        </button>
      </div>

      <div class="nav-group">
        <p class="nav-title">Profil</p>
        <div class="nav-inline">
          <select id="profile-select" aria-label="Profil"></select>
        </div>
      </div>

      <div class="nav-group">
        <p class="nav-title">Semaine</p>
        <div class="week-nav">
          <button type="button" class="btn-ghost" id="prev-week" aria-label="Semaine précédente">‹</button>
          <input type="week" id="week-input" aria-label="Choisir une semaine" />
          <button type="button" class="btn-ghost" id="next-week" aria-label="Semaine suivante">›</button>
        </div>
      </div>

      <div class="nav-group">
        <p class="nav-title">Légende</p>
        <ul class="legend">
          <li><span class="dot d-rose"></span>BTI (tous)</li>
          <li><span class="dot d-jaune"></span>Cours communs</li>
          <li><span class="dot d-bleu"></span>PolyTech + BTI</li>
          <li><span class="dot d-orange"></span>ECM + BTI</li>
          <li><span class="dot d-vert"></span>Événement</li>
        </ul>
      </div>
    </aside>

    <!-- Main -->
    <main class="main glass">
      <header class="topbar">
        <div class="topbar-title">
          <p class="eyebrow" id="topbar-eyebrow">Semaine en cours</p>
          <h1 id="topbar-heading">Aujourd’hui</h1>
        </div>
        <div class="topbar-stats">
          <div class="stat">
            <span class="stat-label">Cours cette semaine</span>
            <div class="stat-row">
              <span class="stat-value" id="stat-count">—</span>
              <span class="stat-delta" id="stat-delta" hidden></span>
            </div>
          </div>
        </div>
      </header>

      <div class="pill-row">
        <div class="pill pill-now" id="pill-now" hidden></div>
        <div class="pill pill-next" id="pill-next" hidden></div>
      </div>

      <section class="calendar-card">
        <div id="calendar-wrap">
          <div id="calendar" class="calendar" role="grid" aria-label="Emploi du temps hebdomadaire"></div>
          <div class="empty-state" id="empty-state" hidden>
            <p>Aucun cours cette semaine.</p>
          </div>
        </div>
      </section>

      <footer class="app-footer">
        <span id="meta-info"></span>
      </footer>
    </main>
  </div>

  <span class="rail-tag rail-tag-top" aria-hidden="true">PLANNING · 2026·27</span>
  <span class="rail-tag rail-tag-bottom" aria-hidden="true">M2 BTI · SETTINGS</span>

  <div id="course-modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-panel glass" role="dialog" aria-labelledby="course-modal-title">
      <button class="modal-close" type="button" data-modal-close aria-label="Fermer">×</button>
      <div id="course-modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
